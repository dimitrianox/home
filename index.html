<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Colección de Viajes</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600&display=swap");

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #070e17;
      color: #e2e8f0;
      font-family: 'Manrope', sans-serif;
      overflow: hidden;
    }

    .app-layout {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* MAPA LEAFLET EN PANTALLA COMPLETA */
    #mapa {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      background-color: #070e17 !important;
    }

    /* FILTRO DE MAPA OSCURO ELEGANTE */
    #mapa .leaflet-tile-pane {
      filter: invert(90%) hue-rotate(180deg) brightness(60%) contrast(100%) saturate(25%);
      -webkit-filter: invert(90%) hue-rotate(180deg) brightness(60%) contrast(100%) saturate(25%);
    }

    /* OCULTAR CONTROLES Y ATRIBUCIONES NATIVAS DE LEAFLET */
    .leaflet-control-attribution,
    .leaflet-control-zoom,
    .leaflet-bottom,
    .leaflet-right {
      display: none !important;
    }

    /* BARRA SUPERIOR EN 2 RENGLONES */
    .navbar-floating {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      padding: 1.5rem 1.5rem 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(7, 14, 23, 0.9) 0%, rgba(7, 14, 23, 0.6) 70%, rgba(7, 14, 23, 0) 100%);
    }

    .navbar-floating * {
      pointer-events: auto;
    }

    /* RENGLÓN 1: TÍTULO CENTRADO */
    .navbar-header {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .navbar-header h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.3rem;
      letter-spacing: 4px;
      text-align: center;
      background: linear-gradient(180deg, #fff2a3 0%, #d8b467 50%, #9e7a2f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9));
    }

    /* RENGLÓN 2: CIUDADES DESLIZABLES HORIZONTALMENTE */
    .destinations-row {
      display: flex;
      align-items: center;
      gap: 2rem;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      scroll-behavior: smooth;
      padding-bottom: 5px;
      width: 100%;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .destinations-row::-webkit-scrollbar {
      display: none;
    }

    .item-destino {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      text-decoration: none;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .item-destino:hover {
      transform: translateY(-2px);
    }

    .node-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: #0b1522;
      border: 2px solid #475569;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .node-text {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }

    .node-text h2 {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 2px;
      transition: color 0.3s ease;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    .node-text span {
      font-size: 0.75rem;
      color: #64748b;
      letter-spacing: 1px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    /* ESTADO SELECCIONADO (ACTIVO) */
    .item-destino.active .node-dot {
      background: radial-gradient(circle, #fff2a3 0%, #d8b467 60%, #9e7a2f 100%);
      border-color: #fff2a3;
      box-shadow: 0 0 12px rgba(216, 180, 103, 0.9);
    }

    .item-destino.active .node-text h2 {
      background: linear-gradient(180deg, #fff2a3 0%, #d8b467 50%, #9e7a2f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .item-destino.active .node-text span {
      color: #d8b467;
    }

    /* ESTILO DEL MARCADOR DORADO NATIVO */
    .pin-container {
      background: transparent !important;
      border: none !important;
    }

    .custom-pin-glow {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff2a3 0%, #d8b467 60%, #9e7a2f 100%);
      border: 2px solid #ffffff;
      box-shadow: 0 0 20px rgba(216, 180, 103, 1), 0 0 40px rgba(216, 180, 103, 0.9);
      cursor: pointer;
      animation: pinDrop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes pinDrop {
      0% {
        transform: scale(0.1);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <div class="app-layout">
    
    <!-- BARRA SUPERIOR EN DOS RENGLONES -->
    <header class="navbar-floating">
      <!-- RENGLÓN 1: TÍTULO CENTRADO -->
      <div class="navbar-header">
        <h1>MIS VIAJES</h1>
      </div>

      <!-- RENGLÓN 2: CIUDADES DESLIZABLES -->
      <nav class="destinations-row">
        <a class="item-destino" data-galeria="toledo-2025" data-lat="39.8628" data-lng="-4.0273">
          <div class="node-dot"></div>
          <div class="node-text">
            <h2>TOLEDO</h2>
            <span>2025</span>
          </div>
        </a>

        <a class="item-destino" data-galeria="paris-2024" data-lat="48.8566" data-lng="2.3522">
          <div class="node-dot"></div>
          <div class="node-text">
            <h2>PARÍS</h2>
            <span>2024</span>
          </div>
        </a>

        <a class="item-destino" data-galeria="londres-2025" data-lat="51.5074" data-lng="-0.1278">
          <div class="node-dot"></div>
          <div class="node-text">
            <h2>LONDRES</h2>
            <span>2025</span>
          </div>
        </a>
      </nav>
    </header>

    <!-- MAPA LEAFLET -->
    <div id="mapa"></div>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. Inicializar mapa centrado en Europa
    const mapa = L.map('mapa', {
      zoomControl: false,
      attributionControl: false
    }).setView([46.2276, 2.2137], 5);

    setTimeout(() => { mapa.invalidateSize(); }, 200);

    // 2. OpenStreetMap mapa base libre
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(mapa);

    let currentMarker = null;

    // Crear icono personalizado garantizando el renderizado DOM
    const pinIcon = L.divIcon({
      className: 'pin-container',
      html: '<div class="custom-pin-glow"></div>',
      iconSize: [26, 26],
      iconAnchor: [13, 13]
    });

    const items = document.querySelectorAll('.item-destino');

    items.forEach(item => {
      item.addEventListener('click', function(e) {
        e.preventDefault();

        items.forEach(i => i.classList.remove('active'));
        this.classList.add('active');

        const lat = parseFloat(this.dataset.lat);
        const lng = parseFloat(this.dataset.lng);
        const galeria = this.dataset.galeria;

        // 1. Vuelo dinámico de la cámara al destino
        mapa.flyTo([lat, lng], 7, {
          duration: 1.2,
          easeLinearity: 0.25
        });

        // 2. Quitar marcador previo y colocar el nuevo
        if (currentMarker) {
          mapa.removeLayer(currentMarker);
        }
        
        currentMarker = L.marker([lat, lng], { 
          icon: pinIcon,
          zIndexOffset: 1000 
        }).addTo(mapa);

        // 3. Abrir la galería ÚNICAMENTE al hacer clic/tap directo en el pin
        currentMarker.on('click', function() {
          window.location.href = `https://dimitrianox.github.io/Thumbs/?galeria=${galeria}`;
        });
      });
    });

    window.addEventListener('resize', () => {
      mapa.invalidateSize();
    });
  </script>
</body>
</html>
